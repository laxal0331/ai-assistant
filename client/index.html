<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AI Assistant</title>
    <meta name="description" content="AI Assistant" />
    <meta name="author" content="laxal" />
    <link rel="icon" href="/assets/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="stylesheet" href="/base.css" />
    <!-- head -->
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <!-- hydration -->
    <script>
      (function () {
        var match = location.pathname.match(/^\/m\/([^/]+)\/?$/);
        if (!match) return;
        var smallScreen = false;
        try {
          smallScreen =
            (screen && (screen.width <= 320 || screen.height <= 360)) ||
            (window.innerWidth <= 320 || window.innerHeight <= 360);
        } catch (e) {}
        if (smallScreen) {
          location.replace("/w/" + match[1] + location.search + location.hash);
        }
      })();
    </script>
    <script type="module" src="/entry-client.jsx"></script>
  </body>
</html>
